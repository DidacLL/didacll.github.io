name: Deploy AgenticCareerBoost

on:
  workflow_dispatch:
  repository_dispatch:
    types: [agenticcareerboost-deploy]
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout AgenticCareerBoost
        uses: actions/checkout@v4
        with:
          repository: DidacLL/AgenticCareerBoost
          ref: main
          path: source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Compile public report PDFs
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: source/agents/reports/tex
          root_file: |
            sprints/*.tex
            guides/*.tex
          args: -r latexmkrc -pdf -interaction=nonstopmode -halt-on-error

      - name: Publish linked public report PDFs into site artifact
        run: python3 source/agents/reports/tex/tools/publish-public-reports.py

      - name: Resolve career artifact build inputs
        id: career
        run: |
          cd source
          python3 agents/cv/tools/artifact_manifest.py validate
          {
            echo 'root_files<<EOF'
            python3 agents/cv/tools/artifact_manifest.py roots
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compile public career PDFs
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: source/agents/cv
          root_file: ${{ steps.career.outputs.root_files }}
          args: -r latexmkrc -pdf -interaction=nonstopmode -halt-on-error

      - name: Publish generated career PDFs into site artifact
        run: |
          cd source
          python3 agents/cv/tools/artifact_manifest.py publish

      - name: Generate site status data
        run: |
          cd source
          python3 agents/tools/export_status.py

      - name: Validate static site
        run: |
          cd source
          python3 agents/tools/validate_static_site.py

      - name: Prepare artifact
        run: touch source/site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
